<div id="cookie-consent" class="cookie-consent" role="dialog" aria-label="Çerez onayı">
  <div class="cookie-consent-inner">
    <p class="cookie-consent-text">
      🍪 Bu site, size daha iyi bir deneyim sunmak ve <strong>Google AdSense</strong> aracılığıyla
      ilgi alanlarınıza uygun reklamlar gösterebilmek için çerezler kullanır.
    </p>
    <div class="cookie-consent-actions">
      <button id="cookie-accept" class="btn btn-primary btn-sm">Tüm Çerezleri Kabul Et</button>
      <button id="cookie-decline" class="btn btn-sm">Sadece Gerekli Çerezler</button>
    </div>
  </div>
</div>

<script>
  // Cookie consent ve AdSense entegrasyonu
  document.addEventListener('DOMContentLoaded', function() {
    const acceptBtn = document.getElementById('cookie-accept');
    const declineBtn = document.getElementById('cookie-decline');
    
    // Kullanıcının önceki tercihini localStorage'ten al
    const storedPreference = localStorage.getItem('cookie_consent_preference');
    
    if (storedPreference) {
      applyConsentPreference(storedPreference);
      // Banner'ı gizle
      document.getElementById('cookie-consent').style.display = 'none';
    }
    
    acceptBtn.addEventListener('click', function() {
      // Tüm çerezleri kabul et - AdSense'i yükle
      localStorage.setItem('cookie_consent_preference', 'all');
      // GA4'i yükle
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
      applyConsentPreference('all');
      document.getElementById('cookie-consent').style.display = 'none';
    });
    
    declineBtn.addEventListener('click', function() {
      Sadece gerekli çerezleri kabul et - AdSense'i engelle
      localStorage.setItem('cookie_consent_preference', 'necessary_only');
      applyConsentPreference('necessary_only');
      document.getElementById('cookie-consent').style.display = 'none';
    });
  });
  
  function applyConsentPreference(preference) {
    if (preference === 'all') {
      // AdSense scriptini yükle ve başlat
      // async attribute'li loaded olana kadar bekle
      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6584482528556827';
      script.crossOrigin = 'anonymous';
      
      script.onload = function() {
        // Adsense initialized
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      };
      
      document.body.appendChild(script);
    } else if (preference === 'necessary_only') {
      // AdSense scriptini engelle - display:none veya body'siz tut
      // Veya zaten var olan script'i kaldır
      var existingScript = document.querySelector('script[src*="pagead2.googlesync"]');
      if (existingScript) {
        existingScript.remove();
      }
      // Alternative: script'i body'sinEklemeden önce kaldır
      var scripts = document.querySelectorAll('script[src*="pagead2.googlesync"]');
      scripts.forEach(function(s) {
        s.parentNode.removeChild(s);
      });
    }
  }
</script>
</div>
