name: Link Check (haftada 3)

on:
  schedule:
    # Pazartesi, Carsamba, Cuma 05:00 UTC
    - cron: "0 3 * * 1,3,5"
  workflow_dispatch: {}

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check broken links
        run: python check_links.py

      - name: Verify connection_error false positives (NIM + web search)
        run: python verify_connection_errors.py
        continue-on-error: true

      - name: Suggest URL repairs for still-broken products (NIM + web search)
        run: python suggest_url_repairs.py
        continue-on-error: true
