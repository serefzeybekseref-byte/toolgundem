name: Daily Pricing Refresh

on:
  schedule:
    # Gunde 2 kez (04:30 ve 16:30 UTC), diger tum zamanlanmis islerden (02:10, 03:00,
    # 05:00, 06:00, 08:00, 14:00, 20:00 UTC) bilerek uzak tutuldu - cakisma yok.
    # 12 saat arayla calisip 12'ser urun isleyerek (gunde 24 toplam) 306 "Bilinmiyor"
    # urunu ~1-2 ay yerine ~13 gunde kapatir, kota-dostu 4sn araligi korunarak.
    - cron: "30 1 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}

jobs:
  refresh-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh unknown pricing (grounded search)
        run: python refresh_pricing.py 12
