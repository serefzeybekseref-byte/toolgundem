name: Guide Quality Audit (gunluk)

on:
  schedule:
    # Her gun 22:30 UTC - gunluk pipeline'in son calistirmasindan (20:00 UTC) sonra,
    # boylece o gun uretilen yeni rehberler de ayni gece denetlenir. Diger tum
    # zamanlanmis islerden (02:10, 03:00, 04:30, 05:00, 06:00, 08:00, 10:00, 14:00,
    # 16:30, 20:00 UTC) bilerek uzak tutuldu - cakisma yok.
    - cron: "30 22 * * *"
  workflow_dispatch: {}

jobs:
  audit-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rehberleri denetle ve dusuk puanlilari duzelt
        id: audit
        continue-on-error: true
        run: python audit_guides.py --max-fixes 4

      - name: Basarisiz olursa issue ac
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Rehber kalite denetimi basarisiz - ${new Date().toISOString().slice(0,10)}`,
              body: `Log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["rehber-kalite"],
            });
